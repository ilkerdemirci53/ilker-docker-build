name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false # just build check because we are not pushing to registry
          tags: ilker-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_SERVER=${{ secrets.API_SERVER }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
