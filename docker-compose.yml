services:
  app:
    image: ilker-app:latest
    container_name: ilker-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_SERVER: "https://api.example.com"
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
